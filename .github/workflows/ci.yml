# 用户前台 CI：PR 合入前校验 lint / 类型 / 测试 / 静态导出构建
# 生产主站是 csustar.com 源站（非 COS），见 deploy.yml 与 AGENTS.md
name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build static export
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.csustar.wiki
          NEXT_PUBLIC_WS_BASE_URL: wss://api.csustar.wiki
          # OAuth 回调挂备案域 csustar.wiki（开放平台登记一致，见 AGENTS.md）
          NEXT_PUBLIC_REDIRECT_URI: https://csustar.wiki/login/callback/
          NEXT_PUBLIC_GITHUB_REDIRECT_URI: https://csustar.wiki/login/callback/
          # OAuth Client ID 为公开配置（非密钥）
          NEXT_PUBLIC_QQ_CLIENT_ID: "1903673774"
          NEXT_PUBLIC_GITHUB_CLIENT_ID: "Ov23liqBZpdYsZQiqFJy"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: "454929954053-am5b8mn6ov286fhrrljscohfib425ds0.apps.googleusercontent.com"
          NEXT_PUBLIC_USE_MOCK: "false"
