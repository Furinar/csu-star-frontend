server {
    listen 80;
    server_name csustar.wiki www.csustar.wiki;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name csustar.wiki www.csustar.wiki;

    ssl_certificate /etc/letsencrypt/live/csustar.wiki/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csustar.wiki/privkey.pem;

    root /var/www/csustar.wiki/out;
    index index.html;

    access_log /var/log/nginx/csu-star-frontend.access.log;
    error_log /var/log/nginx/csu-star-frontend.error.log warn;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
